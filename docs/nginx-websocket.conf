# ============================================================
# WebSSH 反向代理配置（Nginx）
#
# 用法：
#   宝塔面板 → 网站 → 你的站点 → 设置 → 配置文件
#   将站点原有的 location / 段替换为下面的内容
#
#   或直接编辑站点 conf，确保只保留一份 location / 即可
# ============================================================

location / {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;

    # ---- WebSocket 支持（终端长连接必需，不能删）----
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    # ---- 透传真实 Host ----
    # 源码会校验 WebSocket 的 Origin 与 Host 是否一致，
    # 缺了这行会返回 403，表现为「页面能开但点连接无反应」
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ---- 关闭缓冲，加大超时（终端挂机不断线）----
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

# ------------------------------------------------------------
# 若使用宝塔面板自带的「反向代理」功能，它生成的配置大致如下，
# 其中 $connection_upgrade 需在 http 块中定义（宝塔默认已定义）：
#
#   map $http_upgrade $connection_upgrade {
#       default upgrade;
#       ''      close;
#   }
#
# 若 nginx -t 报 unknown variable "connection_upgrade"，
# 把 proxy_set_header Connection $connection_upgrade;
# 改成 proxy_set_header Connection "upgrade";
# ------------------------------------------------------------
